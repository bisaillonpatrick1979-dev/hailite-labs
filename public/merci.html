<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#071426" />
  <meta name="robots" content="noindex" />
  <title>Merci — Hailite Labs</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    try { if (localStorage.getItem("hailite-lang") === "en") document.documentElement.classList.add("en"); } catch (e) {}
  </script>
</head>
<body>
  <!-- Page affichée après une inscription quand JavaScript est désactivé -->

    <a class="brand" href="/" aria-label="Hailite Labs — accueil">

  <main class="page-simple" id="top">
    <p class="kicker">HAILITE LABS</p>
    <h1><span data-fr>Merci, c'est noté!</span><span data-en>Thanks, you're in!</span></h1>
