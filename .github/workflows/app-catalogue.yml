name: App catalogue checks
on:
  pull_request:
    paths:
      - 'public/**'
      - 'src/**'
      - 'migrations/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/app-catalogue.yml'
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'src/**'
      - 'migrations/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/app-catalogue.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test-only DOM dependencies
        run: npm ci --ignore-scripts
      - name: Check JavaScript syntax
        run: |
          for file in src/*.js public/*.js scripts/*.mjs; do node --check "$file"; done
      - name: Run catalogue, paid download, Stripe, administration and DOM scenarios
        run: npm test
